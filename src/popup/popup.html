<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpyPrice AI</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Header -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-wrapper">
          <span class="logo-icon">🎯</span>
        </div>
        <div class="brand-text">
          <h1 class="brand-name">SpyPrice <span class="badge-ai">AI</span></h1>
          <span class="brand-subtitle">Smart Price Tracker</span>
        </div>
      </div>
      <div class="lang-selector">
        <select id="langSelect" aria-label="Select Language">
          <option value="en">🇬🇧 EN</option>
          <option value="th">🇹🇭 TH</option>
        </select>
      </div>
    </header>

    <!-- Stats Overview Summary -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-value" id="statTotal">0</span>
        <span class="stat-label" id="statTotalLabel">Total Monitored</span>
      </div>
      <div class="stat-card stat-drops">
        <span class="stat-value" id="statDrops">0</span>
        <span class="stat-label" id="statDropsLabel">Price Drops</span>
      </div>
    </div>

    <!-- API Key Settings Card -->
    <section class="card settings-card">
      <div class="settings-header">
        <h2 id="apiKeyTitle" class="card-title">🔑 Gemini API Key</h2>
      </div>
      <div class="input-group">
        <input type="password" id="apiKeyInput" placeholder="Enter Gemini API key (AIzaSy...)" autocomplete="off">
        <button id="saveKeyBtn" class="btn btn-secondary">Save</button>
      </div>
      <p id="keyStatus" class="status-msg"></p>
    </section>

    <!-- Action Buttons -->
    <section class="actions-group">
      <button id="trackTabBtn" class="btn btn-primary btn-block">
        <span class="btn-icon">📌</span> <span id="trackCurrentTabLabel">Track Current Product</span>
      </button>
      <div class="action-row">
        <button id="scanAllBtn" class="btn btn-outline">
          <span class="btn-icon">🔄</span> <span id="scanAllBtnLabel">Scan Prices</span>
        </button>
        <button id="exportCsvBtn" class="btn btn-outline btn-excel">
          <span class="btn-icon">📊</span> <span id="exportCsvLabel">Export to Sheet</span>
        </button>
      </div>
    </section>

    <!-- Monitored Product List -->
    <section class="card list-card">
      <div class="list-header">
        <h2 id="trackedListTitle" class="card-title">Monitored Products</h2>
        <span id="productCount" class="badge-count">0</span>
      </div>
      <div id="productList" class="product-list">
        <!-- Dynamically rendered -->
      </div>
    </section>

    <!-- Footer -->
    <footer class="app-footer">
      <p>Local-First • Zero Infrastructure Fee • <a href="https://github.com/ZillerDX/SpyPrice" target="_blank" rel="noopener">GitHub</a></p>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
